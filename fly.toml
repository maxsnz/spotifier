# fly.toml app configuration file generated for spotifier on 2024-12-19T12:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "spotifier"
primary_region = "fra"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[machine]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1 